name: Deploy JupyterLite

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: JupyterLite installieren
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlite-core==0.3.0 jupyterlite-pyodide-kernel==0.3.0 jupyter_server

      - name: JupyterLite Build erstellen
        run: |
          jupyter lite build --contents content --output-dir dist

      - name: Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
